name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to registry (true/false)"
        required: false
        default: "true"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # NVIDIA CUDA – production image
  # ---------------------------------------------------------------------------
  build-cuda:
    name: Build CUDA image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-cuda
            type=ref,event=pr,suffix=-cuda
            type=semver,pattern={{version}},suffix=-cuda
            type=semver,pattern={{major}}.{{minor}},suffix=-cuda
            type=raw,value=latest-cuda,enable={{is_default_branch}}

      - name: Build and push CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda

  # ---------------------------------------------------------------------------
  # AMD ROCm – production image
  # ---------------------------------------------------------------------------
  build-rocm:
    name: Build ROCm image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-rocm
            type=ref,event=pr,suffix=-rocm
            type=semver,pattern={{version}},suffix=-rocm
            type=semver,pattern={{major}}.{{minor}},suffix=-rocm
            type=raw,value=latest-rocm,enable={{is_default_branch}}

      - name: Build and push ROCm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rocm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rocm
          cache-to: type=gha,mode=max,scope=rocm

  # ---------------------------------------------------------------------------
  # NVIDIA CUDA – development image (only on tags and default branch)
  # ---------------------------------------------------------------------------
  build-dev-cuda:
    name: Build CUDA dev image
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-dev-cuda
            type=semver,pattern={{version}},suffix=-dev-cuda
            type=raw,value=dev-cuda,enable={{is_default_branch}}

      - name: Build and push CUDA dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev.cuda
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-cuda
          cache-to: type=gha,mode=max,scope=dev-cuda

  # ---------------------------------------------------------------------------
  # AMD ROCm – development image (only on tags and default branch)
  # ---------------------------------------------------------------------------
  build-dev-rocm:
    name: Build ROCm dev image
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-dev-rocm
            type=semver,pattern={{version}},suffix=-dev-rocm
            type=raw,value=dev-rocm,enable={{is_default_branch}}

      - name: Build and push ROCm dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev.rocm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-rocm
          cache-to: type=gha,mode=max,scope=dev-rocm
